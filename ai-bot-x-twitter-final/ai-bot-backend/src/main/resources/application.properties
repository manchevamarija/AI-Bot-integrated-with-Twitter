spring.application.name=ai-bot-backend

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.mk.ukim.finki.aibotbackend=DEBUG
logging.level.org.springframework=WARN

logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=864000000
jwt.header=Authorization
jwt.token-prefix=Bearer

vezilka.base-url=https://doniraj.vezilka.ai
vezilka.api-key=${VEZILKA_API_KEY:}
vezilka.submit-path=${VEZILKA_SUBMIT_PATH:/api/donations/text}
vezilka.status-path=${VEZILKA_STATUS_PATH:/api/donations/{reference}}

bot.max-steps-per-target=50
bot.headless=${BOT_HEADLESS:false}
bot.profile-directory=${BOT_PROFILE_DIRECTORY:}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
anthropic.enabled=${ANTHROPIC_ENABLED:false}
x.username=${X_USERNAME:}
x.password=${X_PASSWORD:}
x.extraction-mode=${X_EXTRACTION_MODE:AUTO}
x.bearer-token=${X_BEARER_TOKEN:}
x.browser-auto-login=${X_BROWSER_AUTO_LOGIN:false}
x.max-posts=${X_MAX_POSTS:15}

spring.profiles.active=dev
